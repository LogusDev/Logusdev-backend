name: Pipeline para testes com Jest
on:
  push:
   branches:
      - tests/users
      - tests/clients
   
jobs:
  tests:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - name: Instalação de Dependencias
        run: npm i

      - name: Instalação do SQLite3
        run: npm install sqlite3

      - name: Testes
        run: npm test